<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="'Helvetica Neue', 'Songti SC', sans-serif">
  <!--
    视觉测量系统布置图（俯视图）
    用于论文第 3 章 视觉测量系统
    展示：双摆装置、相机、双 LED 补光、棋盘格标定板、距离尺寸
    比例：1 mm = 0.4 px（图上 400 px = 1000 mm = 1 m）
  -->

  <defs>
    <marker id="dimArr2" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#222"/>
    </marker>
    <!-- LED 光锥渐变 -->
    <radialGradient id="ledcone" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#fff7c0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fff7c0" stop-opacity="0"/>
    </radialGradient>
    <!-- 相机视场锥 -->
    <linearGradient id="fovcone" x1="0" y1="100%" x2="0" y2="0%">
      <stop offset="0%" stop-color="#7ed1ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7ed1ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 标题块 -->
  <text x="450" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">视觉测量系统布置图（俯视）</text>
  <text x="450" y="52" font-size="13" text-anchor="middle" fill="#666">Optical Tracking Layout · Top View · 单位 mm</text>

  <!-- 地面/桌面参考方格背景 -->
  <g stroke="#e8e8e8" stroke-width="0.6">
    <line x1="60" y1="80" x2="60" y2="600"/>
    <line x1="180" y1="80" x2="180" y2="600"/>
    <line x1="300" y1="80" x2="300" y2="600"/>
    <line x1="420" y1="80" x2="420" y2="600"/>
    <line x1="540" y1="80" x2="540" y2="600"/>
    <line x1="660" y1="80" x2="660" y2="600"/>
    <line x1="780" y1="80" x2="780" y2="600"/>
    <line x1="60" y1="80" x2="780" y2="80"/>
    <line x1="60" y1="200" x2="780" y2="200"/>
    <line x1="60" y1="320" x2="780" y2="320"/>
    <line x1="60" y1="440" x2="780" y2="440"/>
    <line x1="60" y1="560" x2="780" y2="560"/>
  </g>
  <text x="55" y="595" font-size="9" fill="#aaa">[ 250 mm 网格 ]</text>

  <!-- ============================ 顶部：双摆装置足迹（俯视） ============================ -->
  <!-- 框架底部俯视：500mm × 100mm 矩形（depth=100mm 是型材+背板厚度的近似） -->
  <!-- 屏上：x 220..420（=500mm 宽），y 100..140（=100mm 深） -->
  <!-- 实际位置：壁前 -->
  <rect x="220" y="100" width="320" height="40" fill="#d8dbdc" stroke="#222" stroke-width="1.6"/>
  <!-- 后方背板（贴墙的哑光黑亚克力） -->
  <rect x="220" y="92" width="320" height="8" fill="#1a1a1a"/>
  <!-- 4 个立柱断面（俯视小方块） -->
  <rect x="220" y="100" width="16" height="16" fill="#444" stroke="#000" stroke-width="0.6"/>
  <rect x="524" y="100" width="16" height="16" fill="#444" stroke="#000" stroke-width="0.6"/>
  <rect x="220" y="124" width="16" height="16" fill="#444" stroke="#000" stroke-width="0.6"/>
  <rect x="524" y="124" width="16" height="16" fill="#444" stroke="#000" stroke-width="0.6"/>

  <!-- 摆动平面（虚线，沿框架中心，左右延伸表示摆能 swing 到的范围） -->
  <line x1="180" y1="120" x2="580" y2="120" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="585" y="124" font-size="11" font-style="italic" fill="#c0392b">摆动平面（侧投影）</text>

  <!-- 双摆装置标签 -->
  <text x="380" y="156" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">双摆装置（贴墙安装）</text>
  <text x="380" y="172" font-size="10" text-anchor="middle" fill="#666">框架 500 × 600 (W×H) · 厚 50</text>

  <!-- 墙面填充示意 -->
  <pattern id="wallpat" patternUnits="userSpaceOnUse" width="10" height="10">
    <rect width="10" height="10" fill="#f4f1ec"/>
    <path d="M 0 0 L 10 10 M -2 8 L 2 12 M 8 -2 L 12 2" stroke="#d6cfc3" stroke-width="0.5"/>
  </pattern>
  <rect x="60" y="80" width="720" height="12" fill="url(#wallpat)"/>
  <text x="755" y="91" font-size="10" fill="#999">墙</text>

  <!-- ============================ 中部：相机视场锥 ============================ -->
  <!-- 相机位置：(380, 460)，朝上拍摆平面
       视场角 ≈ 60°（手机摄像头近似），距离 ~800mm，所以摆平面 0.5 m × ~0.5 m 完全在内 -->
  <polygon points="380,460 200,140 560,140" fill="url(#fovcone)" stroke="none"/>
  <line x1="380" y1="460" x2="200" y2="140" stroke="#3498db" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="380" y1="460" x2="560" y2="140" stroke="#3498db" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="180" y="220" font-size="11" font-style="italic" fill="#3498db">视场 ≈ 60°</text>

  <!-- 相机光轴（中心线） -->
  <line x1="380" y1="460" x2="380" y2="140" stroke="#3498db" stroke-width="1.6"/>
  <circle cx="380" cy="300" r="3" fill="#3498db"/>
  <text x="388" y="304" font-size="10" font-style="italic" fill="#3498db">光轴 ⊥ 摆平面</text>

  <!-- ============================ 相机本体（三脚架顶部俯视） ============================ -->
  <!-- 三脚架圆形云台 -->
  <circle cx="380" cy="475" r="20" fill="#2c3e50" stroke="#1a252f" stroke-width="1.6"/>
  <!-- 手机机身（矩形，长边沿光轴方向） -->
  <rect x="364" y="450" width="32" height="48" rx="3" fill="#1a1a1a" stroke="#000" stroke-width="1"/>
  <!-- 镜头（朝上） -->
  <circle cx="380" cy="460" r="5" fill="#0a0a0a" stroke="#444" stroke-width="1.4"/>
  <circle cx="380" cy="460" r="2" fill="#3498db"/>
  <!-- 三脚架 3 条腿（俯视交叉） -->
  <g stroke="#444" stroke-width="2">
    <line x1="380" y1="475" x2="350" y2="520"/>
    <line x1="380" y1="475" x2="410" y2="520"/>
    <line x1="380" y1="475" x2="380" y2="540"/>
  </g>
  <circle cx="350" cy="520" r="4" fill="#666"/>
  <circle cx="410" cy="520" r="4" fill="#666"/>
  <circle cx="380" cy="540" r="4" fill="#666"/>

  <text x="425" y="478" font-size="12" font-weight="bold" fill="#222">📱 相机</text>
  <text x="425" y="494" font-size="10" fill="#555">手机 60 fps（1080p）</text>
  <text x="425" y="508" font-size="10" fill="#555">分辨率 1920×1080，水平模式</text>
  <text x="425" y="522" font-size="10" fill="#555">三脚架水平校正 ≤ 0.5°</text>

  <!-- ============================ 双 LED 补光（左右两侧，朝向摆平面） ============================ -->
  <!-- 左 LED：位置 (240, 380)，光锥指向右上方 -->
  <polygon points="240,380 195,140 285,140" fill="url(#ledcone)" stroke="none" opacity="0.7"/>
  <circle cx="240" cy="380" r="12" fill="#ffd84d" stroke="#a87f1c" stroke-width="2"/>
  <circle cx="240" cy="380" r="6" fill="#fff" opacity="0.9"/>
  <text x="180" y="402" font-size="11" font-weight="bold" fill="#a87f1c">LED-L</text>
  <text x="170" y="416" font-size="9" fill="#7a5e10">10W 5500K 柔光</text>

  <!-- 右 LED：(520, 380) -->
  <polygon points="520,380 475,140 565,140" fill="url(#ledcone)" stroke="none" opacity="0.7"/>
  <circle cx="520" cy="380" r="12" fill="#ffd84d" stroke="#a87f1c" stroke-width="2"/>
  <circle cx="520" cy="380" r="6" fill="#fff" opacity="0.9"/>
  <text x="540" y="402" font-size="11" font-weight="bold" fill="#a87f1c">LED-R</text>
  <text x="540" y="416" font-size="9" fill="#7a5e10">10W 5500K 柔光</text>

  <!-- LED 连线（角度 ~45°，避免直接反射进相机） -->
  <text x="290" y="335" font-size="10" font-style="italic" fill="#a87f1c">LED 与光轴各成 ~30°</text>

  <!-- ============================ 棋盘格标定板（左上角，待标定位置） ============================ -->
  <!-- 棋盘格俯视图 -->
  <g transform="translate(80, 230)">
    <rect x="0" y="0" width="80" height="60" fill="#fff" stroke="#222" stroke-width="1.4"/>
    <!-- 8×6 棋盘格图案 -->
    <g fill="#222">
      <rect x="0" y="0" width="10" height="10"/>
      <rect x="20" y="0" width="10" height="10"/>
      <rect x="40" y="0" width="10" height="10"/>
      <rect x="60" y="0" width="10" height="10"/>
      <rect x="10" y="10" width="10" height="10"/>
      <rect x="30" y="10" width="10" height="10"/>
      <rect x="50" y="10" width="10" height="10"/>
      <rect x="70" y="10" width="10" height="10"/>
      <rect x="0" y="20" width="10" height="10"/>
      <rect x="20" y="20" width="10" height="10"/>
      <rect x="40" y="20" width="10" height="10"/>
      <rect x="60" y="20" width="10" height="10"/>
      <rect x="10" y="30" width="10" height="10"/>
      <rect x="30" y="30" width="10" height="10"/>
      <rect x="50" y="30" width="10" height="10"/>
      <rect x="70" y="30" width="10" height="10"/>
      <rect x="0" y="40" width="10" height="10"/>
      <rect x="20" y="40" width="10" height="10"/>
      <rect x="40" y="40" width="10" height="10"/>
      <rect x="60" y="40" width="10" height="10"/>
      <rect x="10" y="50" width="10" height="10"/>
      <rect x="30" y="50" width="10" height="10"/>
      <rect x="50" y="50" width="10" height="10"/>
      <rect x="70" y="50" width="10" height="10"/>
    </g>
    <text x="40" y="78" font-size="11" font-weight="bold" text-anchor="middle" fill="#222">棋盘格标定板</text>
    <text x="40" y="92" font-size="9" text-anchor="middle" fill="#666">9×7 角点, 格 20mm</text>
    <text x="40" y="105" font-size="9" text-anchor="middle" fill="#666">（标定时贴摆平面）</text>
  </g>

  <!-- 标定阶段示意箭头：从棋盘格→摆位置 -->
  <path d="M 165 260 Q 230 200 290 145" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#dimArr2)"/>
  <text x="195" y="220" font-size="9" font-style="italic" fill="#666">标定时移到此处</text>

  <!-- ============================ 尺寸标注 ============================ -->
  <!-- 相机到墙距离 ~1000 mm -->
  <line x1="700" y1="100" x2="700" y2="460" stroke="#222" stroke-width="1.2" marker-start="url(#dimArr2)" marker-end="url(#dimArr2)"/>
  <line x1="690" y1="100" x2="710" y2="100" stroke="#222" stroke-width="1"/>
  <line x1="690" y1="460" x2="710" y2="460" stroke="#222" stroke-width="1"/>
  <text x="715" y="285" font-size="14" font-weight="bold" fill="#222">D ≈ 1000</text>
  <text x="715" y="302" font-size="10" fill="#666">相机至摆平面</text>

  <!-- LED 左右间距 -->
  <line x1="240" y1="395" x2="520" y2="395" stroke="#222" stroke-width="1" marker-start="url(#dimArr2)" marker-end="url(#dimArr2)"/>
  <text x="380" y="392" font-size="12" font-weight="bold" text-anchor="middle" fill="#222">700</text>

  <!-- LED 到摆距离 -->
  <line x1="240" y1="380" x2="240" y2="140" stroke="#222" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="180" y="265" font-size="10" fill="#666">LED-墙 ≈ 600</text>

  <!-- ============================ 右下角说明框 ============================ -->
  <rect x="610" y="450" width="260" height="160" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="6"/>
  <text x="623" y="472" font-size="14" font-weight="bold" fill="#222">关键工程参数</text>
  <line x1="623" y1="478" x2="860" y2="478" stroke="#999" stroke-width="0.6"/>

  <text x="623" y="498" font-size="11" font-weight="bold" fill="#333">采集帧率</text>
  <text x="700" y="498" font-size="11" fill="#444">60 fps (16.7 ms/帧)</text>

  <text x="623" y="516" font-size="11" font-weight="bold" fill="#333">空间分辨率</text>
  <text x="700" y="516" font-size="11" fill="#444">~0.4 mm/像素 @ 1m</text>

  <text x="623" y="534" font-size="11" font-weight="bold" fill="#333">追踪精度目标</text>
  <text x="720" y="534" font-size="11" fill="#444">≤ 1 mm（亚像素质心）</text>

  <text x="623" y="552" font-size="11" font-weight="bold" fill="#333">单段时长</text>
  <text x="700" y="552" font-size="11" fill="#444">15–30 s（含衰减）</text>

  <text x="623" y="570" font-size="11" font-weight="bold" fill="#333">同步</text>
  <text x="660" y="570" font-size="10" fill="#444">t=0 取自视频引入窗（手动释放）</text>

  <text x="623" y="588" font-size="11" font-weight="bold" fill="#333">数据格式</text>
  <text x="688" y="588" font-size="11" fill="#444">CSV: t, θ₁, θ₂, ẋ₁, ẋ₂</text>

  <text x="623" y="604" font-size="10" font-style="italic" fill="#888">详见 ~/ChaoticNet/data/README.md</text>

</svg>
