<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" font-family="'Helvetica Neue', 'Songti SC', sans-serif">
  <!--
    ChaoticNet 双摆装置 零件图 P03 - 配重盘（v2.1: 45# 碳钢，厚 12mm，质量 ≈ 66g，M3 通孔螺纹）
    比例：俯视图 5:1（30mm 显示为 150 px 直径）
    单位：mm  |  GB/T 1804-m 一般公差
  -->

  <defs>
    <marker id="da3" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#111"/>
    </marker>
    <!-- 钢盘质感渐变（v2.1: 45# 钢，ID 名留 brass 是历史命名，不影响显示） -->
    <radialGradient id="brass" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#e0e3e6"/>
      <stop offset="60%" stop-color="#9aa0a6"/>
      <stop offset="100%" stop-color="#4a4f54"/>
    </radialGradient>
    <!-- 剖面填充（45° 斜线，金属剖面标准） -->
    <pattern id="sectpat" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect width="6" height="6" fill="#d8dbde"/>
      <path d="M 0 6 L 6 0" stroke="#4a4f54" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect x="20" y="20" width="1060" height="720" fill="none" stroke="#222" stroke-width="1.6"/>
  <rect x="20" y="20" width="1060" height="40" fill="#f0f0f0" stroke="#222" stroke-width="1.6"/>
  <text x="40" y="48" font-size="20" font-weight="bold" fill="#111">P03 · 配重盘（Steel Weight Disc，v2: 45# 碳钢）</text>
  <text x="900" y="44" font-size="11" text-anchor="end" fill="#444">单位 mm · 俯视 5:1 / 剖视 5:1 · GB/T 1804-m</text>
  <text x="900" y="56" font-size="11" text-anchor="end" fill="#444">ChaoticNet / 双摆混沌项目</text>

  <!-- ============================ 俯视图（左半） ============================ -->
  <text x="220" y="105" font-size="14" font-weight="bold" fill="#111">俯视图  Top View（5:1）</text>
  <line x1="40" y1="112" x2="430" y2="112" stroke="#999" stroke-width="0.6"/>

  <!-- 外圆 ⌀30 × 5 = 150 px 直径，半径 75 px -->
  <circle cx="240" cy="290" r="75" fill="url(#brass)" stroke="#111" stroke-width="2.2"/>

  <!-- 中心 M3 螺纹孔：⌀3 主线 + 外圈 0.75 mm 虚线（机械制图中螺纹符号） -->
  <circle cx="240" cy="290" r="7.5" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="240" cy="290" r="9.4" fill="none" stroke="#111" stroke-width="0.6" stroke-dasharray="4,2"/>

  <!-- 十字中心线 -->
  <line x1="150" y1="290" x2="330" y2="290" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="10,3,2,3"/>
  <line x1="240" y1="200" x2="240" y2="380" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="10,3,2,3"/>

  <!-- 外径标注 ⌀30（评审建议：引线明确触达外圆边缘） -->
  <line x1="158" y1="290" x2="322" y2="290" stroke="#111" stroke-width="1" marker-start="url(#da3)" marker-end="url(#da3)"/>
  <!-- 外圆边缘指示标记 -->
  <line x1="165" y1="284" x2="165" y2="296" stroke="#111" stroke-width="0.8"/>
  <line x1="315" y1="284" x2="315" y2="296" stroke="#111" stroke-width="0.8"/>
  <text x="240" y="285" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">⌀30 ±0.1</text>

  <!-- 内孔螺纹标注 M3 -->
  <line x1="290" y1="320" x2="350" y2="350" stroke="#111" stroke-width="0.8"/>
  <text x="355" y="354" font-size="14" font-weight="bold" fill="#111">M3-6H 通孔</text>
  <text x="355" y="370" font-size="10" fill="#666">底孔 ⌀2.5 通孔，全通攻 M3 螺纹</text>

  <!-- 重量/材料标注 -->
  <text x="240" y="410" font-size="13" text-anchor="middle" font-weight="bold" fill="#333">质量 m₂ ≈ 66 g</text>
  <text x="240" y="426" font-size="10" text-anchor="middle" fill="#333">（45# 碳钢，密度 7.85 g/cm³）</text>

  <!-- ============================ 剖视图（向左移动 150px，避开 x=710 的技术要求框） ============================ -->
  <text x="500" y="105" font-size="14" font-weight="bold" fill="#111">A-A 剖视图  Section View（5:1）</text>
  <line x1="380" y1="112" x2="700" y2="112" stroke="#999" stroke-width="0.6"/>

  <!-- 剖切符号 A-A 在俯视图上 -->
  <line x1="155" y1="290" x2="325" y2="290" stroke="#666" stroke-width="2" stroke-dasharray="20,2,4,2"/>
  <text x="148" y="294" font-size="14" font-weight="bold" fill="#666">A</text>
  <text x="328" y="294" font-size="14" font-weight="bold" fill="#666">A</text>
  <polygon points="155,295 145,300 155,305" fill="#666"/>
  <polygon points="325,295 335,300 325,305" fill="#666"/>

  <!-- 剖视图本体：中心 x=500（原 650 - 150）
       上半 x 425→487.5，下半 x 512.5→575，M3 孔 x 487.5→512.5，y 245→305 -->
  <rect x="425" y="245" width="62.5" height="60" fill="url(#sectpat)" stroke="#111" stroke-width="2"/>
  <rect x="512.5" y="245" width="62.5" height="60" fill="url(#sectpat)" stroke="#111" stroke-width="2"/>
  <!-- 中间是 M3 通孔（空），含螺纹虚线 -->
  <rect x="487.5" y="245" width="25" height="60" fill="#fff" stroke="#111" stroke-width="1.4"/>
  <!-- 螺纹虚线（剖视图中螺纹用虚线表示外径） -->
  <line x1="491.5" y1="245" x2="491.5" y2="305" stroke="#111" stroke-width="0.6" stroke-dasharray="3,2"/>
  <line x1="508.5" y1="245" x2="508.5" y2="305" stroke="#111" stroke-width="0.6" stroke-dasharray="3,2"/>

  <!-- 厚度标注 12 mm（在剖视图右侧） -->
  <line x1="605" y1="245" x2="605" y2="305" stroke="#111" stroke-width="1" marker-start="url(#da3)" marker-end="url(#da3)"/>
  <line x1="575" y1="245" x2="610" y2="245" stroke="#111" stroke-width="0.6"/>
  <line x1="575" y1="305" x2="610" y2="305" stroke="#111" stroke-width="0.6"/>
  <text x="625" y="278" font-size="15" font-weight="bold" fill="#111">12 ±0.1</text>

  <!-- 外径标注 ⌀30（剖视图顶部） -->
  <line x1="425" y1="220" x2="575" y2="220" stroke="#111" stroke-width="1" marker-start="url(#da3)" marker-end="url(#da3)"/>
  <line x1="425" y1="245" x2="425" y2="215" stroke="#111" stroke-width="0.6"/>
  <line x1="575" y1="245" x2="575" y2="215" stroke="#111" stroke-width="0.6"/>
  <text x="500" y="213" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">⌀30 ±0.1</text>

  <!-- 内孔标注 M3（剖视图底部） -->
  <line x1="487.5" y1="335" x2="512.5" y2="335" stroke="#111" stroke-width="1" marker-start="url(#da3)" marker-end="url(#da3)"/>
  <text x="500" y="356" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">M3 (⌀3.0)</text>

  <!-- 倒角 C0.5×45°（外圆两端） -->
  <line x1="425" y1="248" x2="405" y2="240" stroke="#111" stroke-width="0.6"/>
  <text x="350" y="240" font-size="10" fill="#111">C0.5×45°</text>
  <line x1="575" y1="248" x2="595" y2="240" stroke="#111" stroke-width="0.6"/>
  <text x="597" y="240" font-size="10" fill="#111">两端各一</text>

  <!-- 中心轴线 -->
  <line x1="500" y1="220" x2="500" y2="330" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="10,3,2,3"/>

  <!-- ============================ 安装示意（说明它怎么装到摆臂 2） ============================ -->
  <text x="100" y="470" font-size="14" font-weight="bold" fill="#111">装配示意  Assembly Reference</text>
  <line x1="40" y1="478" x2="500" y2="478" stroke="#999" stroke-width="0.6"/>

  <!-- 摆臂 2 末端俯视 + 钢盘 + 螺栓示意 -->
  <!-- 摆臂局部 -->
  <rect x="80" y="525" width="100" height="40" fill="#e8eaec" stroke="#111" stroke-width="1.5"/>
  <text x="100" y="520" font-size="10" fill="#444">摆臂 2 末端（4mm 厚）</text>
  <!-- P03 配重盘 (v2: 钢) -->

  <circle cx="180" cy="545" r="6" fill="#fff" stroke="#111" stroke-width="1.4"/>
  <text x="148" y="585" font-size="9" fill="#666">⌀3.4 过孔（同 P02 孔 B）</text>

  <!-- M3 螺栓 -->
  <rect x="195" y="540" width="45" height="10" fill="#888" stroke="#222" stroke-width="1"/>
  <rect x="195" y="538" width="6" height="14" fill="#666" stroke="#222" stroke-width="1"/>
  <text x="200" y="528" font-size="10" fill="#444">M3×16 不锈钢内六角螺栓</text>

  <!-- 钢盘 -->
  <ellipse cx="290" cy="545" rx="22" ry="38" fill="url(#brass)" stroke="#111" stroke-width="1.5"/>
  <line x1="270" y1="545" x2="310" y2="545" stroke="#fff" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="290" y="595" font-size="10" text-anchor="middle" fill="#333">P03 钢盘</text>
  <text x="290" y="608" font-size="10" text-anchor="middle" fill="#333">M3 螺纹</text>

  <!-- 流向箭头 -->
  <line x1="245" y1="545" x2="270" y2="545" stroke="#444" stroke-width="1.5" marker-end="url(#da3)"/>

  <text x="340" y="540" font-size="11" fill="#444">螺栓穿摆臂 ⌀3.4 过孔</text>
  <text x="340" y="555" font-size="11" fill="#444">拧入钢盘 M3 螺纹</text>
  <text x="340" y="570" font-size="11" fill="#444">紧固成一体，质心 ≈ 摆臂末端</text>

  <!-- ============================ 右侧技术要求 + 标题块 ============================ -->
  <rect x="725" y="100" width="350" height="290" fill="#fff" stroke="#666" stroke-width="1.2" rx="3"/>
  <rect x="725" y="100" width="350" height="26" fill="#dfe5ea" stroke="#666" stroke-width="1.2"/>
  <text x="739" y="119" font-size="14" font-weight="bold" fill="#111">技术要求  Technical Requirements</text>

  <text x="739" y="148" font-size="12" font-weight="bold" fill="#222">① 材料</text>
  <text x="755" y="166" font-size="11" fill="#333">45# 碳钢（GB/T 699）</text>
  <text x="755" y="180" font-size="11" fill="#333">⌀30 mm 圆棒料，切 12mm 段</text>

  <text x="739" y="204" font-size="12" font-weight="bold" fill="#222">② 加工方式</text>
  <text x="755" y="222" font-size="11" fill="#333">车床切割端面平整</text>
  <text x="755" y="236" font-size="11" fill="#333">中心钻 ⌀2.5 通孔，攻 M3-6H 全通螺纹</text>

  <text x="739" y="260" font-size="12" font-weight="bold" fill="#222">③ 表面</text>
  <text x="755" y="278" font-size="11" fill="#333">外圆 + 端面车光，喷透明防锈漆薄层</text>
  <text x="755" y="292" font-size="11" fill="#333">（漆层 &lt; 5μm，重量影响 &lt; 0.05g）</text>

  <text x="739" y="316" font-size="12" font-weight="bold" fill="#222">④ 公差</text>
  <text x="755" y="334" font-size="11" fill="#333">外径 ⌀30 ±0.1（保证质心准确）</text>
  <text x="755" y="348" font-size="11" fill="#333">厚度 12 ±0.1</text>
  <text x="755" y="362" font-size="11" fill="#333">质量目标 66 ±2 g（成品称重验收）</text>

  <text x="739" y="386" font-size="11" font-style="italic" fill="#666">实际称重作为论文 m₂ 参数</text>

  <rect x="725" y="410" width="350" height="210" fill="#fafafa" stroke="#222" stroke-width="1.4"/>
  <line x1="725" y1="440" x2="1075" y2="440" stroke="#222" stroke-width="1"/>
  <line x1="725" y1="475" x2="1075" y2="475" stroke="#222" stroke-width="0.8"/>
  <line x1="725" y1="510" x2="1075" y2="510" stroke="#222" stroke-width="0.8"/>
  <line x1="725" y1="545" x2="1075" y2="545" stroke="#222" stroke-width="0.8"/>
  <line x1="725" y1="580" x2="1075" y2="580" stroke="#222" stroke-width="0.8"/>
  <line x1="865" y1="440" x2="865" y2="620" stroke="#222" stroke-width="0.8"/>

  <text x="739" y="432" font-size="13" font-weight="bold" fill="#111">标题块  Title Block</text>

  <text x="739" y="462" font-size="11" fill="#666">零件号</text>
  <text x="875" y="462" font-size="12" font-weight="bold" fill="#111">P03</text>
  <text x="739" y="497" font-size="11" fill="#666">名称</text>
  <text x="875" y="497" font-size="12" font-weight="bold" fill="#111">钢配重盘</text>
  <text x="739" y="532" font-size="11" fill="#666">数量</text>
  <text x="875" y="532" font-size="12" font-weight="bold" fill="#111">1</text>
  <text x="739" y="567" font-size="11" fill="#666">材料</text>
  <text x="875" y="567" font-size="12" fill="#111">45# 碳钢</text>
  <text x="739" y="602" font-size="11" fill="#666">DXF 文件</text>
  <text x="875" y="602" font-size="11" fill="#111">parts/dxf/P03_brass_weight.dxf</text>

  <rect x="40" y="650" width="1020" height="80" fill="#fff8e6" stroke="#d9a441" stroke-width="1.2" rx="4"/>
  <text x="55" y="671" font-size="12" font-weight="bold" fill="#7a5b15">⚠️ 给加工厂的备注</text>
  <text x="55" y="690" font-size="11" fill="#5a4216">· 这是车削件，不是激光切割件——找车床加工的厂家做（同一家激光切割厂大概率也接车活）</text>
  <text x="55" y="706" font-size="11" fill="#5a4216">· 质量目标 66 g 是关键，验收时实际称重，超出 ±2 g 范围需调整厚度（每多 1mm 厚度增重约 5.5g）</text>
  <text x="55" y="722" font-size="11" fill="#5a4216">· 不接受铸造件或粉末冶金件——必须是实心车削，密度均匀性影响质心定位；钢盘车完喷透明防锈漆防锈</text>
</svg>
