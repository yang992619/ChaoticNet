<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" font-family="'Helvetica Neue', 'Songti SC', sans-serif">
  <!--
    ChaoticNet 双摆装置 零件图 P02 - 摆臂 2
    比例：2 px = 1 mm  |  GB/T 1804-m 一般公差
  -->

  <defs>
    <marker id="da2" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#111"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1060" height="720" fill="none" stroke="#222" stroke-width="1.6"/>
  <rect x="20" y="20" width="1060" height="40" fill="#f0f0f0" stroke="#222" stroke-width="1.6"/>
  <text x="40" y="48" font-size="20" font-weight="bold" fill="#111">P02 · 摆臂 2（Pendulum Arm #2，配重端）</text>
  <text x="900" y="44" font-size="11" text-anchor="end" fill="#444">单位 mm · 比例 1:1 · GB/T 1804-m</text>
  <text x="900" y="56" font-size="11" text-anchor="end" fill="#444">ChaoticNet / 双摆混沌项目</text>

  <text x="365" y="100" font-size="14" font-weight="bold" fill="#111">前视图  Front View（2:1 显示）</text>
  <line x1="40" y1="108" x2="700" y2="108" stroke="#999" stroke-width="0.6"/>

  <!-- 摆臂 2 轮廓：225mm × 25mm，圆角 R12.5
       2 px = 1 mm → 450 px × 50 px
       x: 150 → 600（长 450 px），y: 195 → 245
       圆心：left @ (175, 220), right @ (575, 220)，孔心距 = 400 px = 200 mm
  -->
  <path d="M 175,195 L 575,195 A 25 25 0 0 1 575,245 L 175,245 A 25 25 0 0 1 175,195 Z"
        fill="#e8eaec" stroke="#111" stroke-width="2"/>

  <line x1="145" y1="220" x2="605" y2="220" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="10,3,2,3"/>

  <!-- 孔 A（上端，⌀5 H7，配关节轴销过盈压入；关节轴承在 P01 摆臂 1 下端） -->
  <circle cx="175" cy="220" r="5" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="175" cy="220" r="2" fill="#111"/>
  <line x1="175" y1="200" x2="175" y2="240" stroke="#c0392b" stroke-width="0.6" stroke-dasharray="3,2"/>
  <line x1="155" y1="220" x2="195" y2="220" stroke="#c0392b" stroke-width="0.6" stroke-dasharray="3,2"/>
  <text x="170" y="187" font-size="13" font-weight="bold" fill="#c0392b">A</text>

  <!-- 孔 B（下端，⌀3.4，M3 通孔过 P03 钢配重的螺栓；评审 4 号建议：3.2→3.4 中配） -->
  <circle cx="575" cy="220" r="3.4" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="575" cy="220" r="1.3" fill="#111"/>
  <line x1="575" y1="200" x2="575" y2="240" stroke="#c0392b" stroke-width="0.6" stroke-dasharray="3,2"/>
  <line x1="555" y1="220" x2="595" y2="220" stroke="#c0392b" stroke-width="0.6" stroke-dasharray="3,2"/>
  <text x="569" y="187" font-size="13" font-weight="bold" fill="#c0392b">B</text>

  <!-- 总长 225 mm -->
  <line x1="150" y1="295" x2="600" y2="295" stroke="#111" stroke-width="1" marker-start="url(#da2)" marker-end="url(#da2)"/>
  <line x1="150" y1="245" x2="150" y2="305" stroke="#111" stroke-width="0.6"/>
  <line x1="600" y1="245" x2="600" y2="305" stroke="#111" stroke-width="0.6"/>
  <text x="375" y="290" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">225 ±0.2</text>

  <!-- 总宽 25 mm -->
  <line x1="115" y1="195" x2="115" y2="245" stroke="#111" stroke-width="1" marker-start="url(#da2)" marker-end="url(#da2)"/>
  <line x1="105" y1="195" x2="150" y2="195" stroke="#111" stroke-width="0.6"/>
  <line x1="105" y1="245" x2="150" y2="245" stroke="#111" stroke-width="0.6"/>
  <text x="105" y="225" font-size="13" font-weight="bold" text-anchor="end" fill="#111">25 ±0.1</text>

  <!-- 孔 A → 左端 12.5mm -->
  <line x1="150" y1="165" x2="175" y2="165" stroke="#111" stroke-width="1" marker-start="url(#da2)" marker-end="url(#da2)"/>
  <line x1="150" y1="160" x2="150" y2="195" stroke="#111" stroke-width="0.6"/>
  <line x1="175" y1="160" x2="175" y2="200" stroke="#111" stroke-width="0.6"/>
  <text x="163" y="156" font-size="11" text-anchor="middle" fill="#111">12.5</text>

  <!-- 孔 B → 右端 12.5mm -->
  <line x1="575" y1="165" x2="600" y2="165" stroke="#111" stroke-width="1" marker-start="url(#da2)" marker-end="url(#da2)"/>
  <line x1="600" y1="160" x2="600" y2="195" stroke="#111" stroke-width="0.6"/>
  <line x1="575" y1="160" x2="575" y2="200" stroke="#111" stroke-width="0.6"/>
  <text x="588" y="156" font-size="11" text-anchor="middle" fill="#111">12.5</text>

  <!-- 孔心距 A-B：200 mm（关键尺寸 = L₂） -->
  <line x1="175" y1="135" x2="575" y2="135" stroke="#c0392b" stroke-width="1.4" marker-start="url(#da2)" marker-end="url(#da2)"/>
  <line x1="175" y1="135" x2="175" y2="160" stroke="#c0392b" stroke-width="0.6"/>
  <line x1="575" y1="135" x2="575" y2="160" stroke="#c0392b" stroke-width="0.6"/>
  <text x="375" y="128" font-size="16" font-weight="bold" text-anchor="middle" fill="#c0392b">200 ±0.1</text>
  <text x="375" y="148" font-size="10" font-style="italic" text-anchor="middle" fill="#c0392b">= L₂ 物理摆长（关键尺寸）</text>

  <text x="165" y="270" font-size="11" fill="#111">R12.5</text>
  <line x1="166" y1="263" x2="150" y2="245" stroke="#111" stroke-width="0.6"/>

  <!-- ============================ 侧视图 + 两个孔位详图 ============================ -->
  <text x="100" y="380" font-size="14" font-weight="bold" fill="#111">侧视图  Side View（5:1）</text>
  <line x1="40" y1="388" x2="240" y2="388" stroke="#999" stroke-width="0.6"/>

  <rect x="100" y="430" width="20" height="125" fill="#e8eaec" stroke="#111" stroke-width="1.8"/>
  <line x1="100" y1="580" x2="120" y2="580" stroke="#111" stroke-width="1" marker-start="url(#da2)" marker-end="url(#da2)"/>
  <line x1="100" y1="555" x2="100" y2="585" stroke="#111" stroke-width="0.6"/>
  <line x1="120" y1="555" x2="120" y2="585" stroke="#111" stroke-width="0.6"/>
  <text x="110" y="600" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">4 ±0.05</text>
  <line x1="100" y1="430" x2="80" y2="420" stroke="#111" stroke-width="0.6"/>
  <text x="60" y="416" font-size="10" fill="#111">C0.5×45°</text>

  <!-- 孔 A 详图（⌀5 H7） -->
  <text x="290" y="380" font-size="14" font-weight="bold" fill="#111">孔 A 详图（8:1）·⌀5 H7</text>
  <circle cx="370" cy="480" r="40" fill="#fff" stroke="#111" stroke-width="2.2"/>
  <circle cx="370" cy="480" r="3" fill="#111"/>
  <line x1="310" y1="480" x2="430" y2="480" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="8,3,2,3"/>
  <line x1="370" y1="420" x2="370" y2="540" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="8,3,2,3"/>
  <line x1="330" y1="480" x2="410" y2="480" stroke="#111" stroke-width="1" marker-start="url(#da2)" marker-end="url(#da2)"/>
  <text x="370" y="560" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">⌀5 H7（+0.012/0）</text>
  <text x="370" y="578" font-size="10" text-anchor="middle" fill="#666">⌀5×12 圆柱销过盈压入（P05 关节轴销）</text>
  <text x="370" y="592" font-size="10" text-anchor="middle" fill="#666">轴承在 P01 摆臂 1 下端</text>

  <!-- 孔 B 详图（⌀3.4 M3 中配过孔） -->
  <text x="500" y="380" font-size="14" font-weight="bold" fill="#111">孔 B 详图（10:1）·M3 通孔</text>
  <circle cx="590" cy="480" r="32" fill="#fff" stroke="#111" stroke-width="2.2"/>
  <circle cx="590" cy="480" r="2.5" fill="#111"/>
  <line x1="540" y1="480" x2="640" y2="480" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="8,3,2,3"/>
  <line x1="590" y1="430" x2="590" y2="540" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="8,3,2,3"/>
  <line x1="558" y1="480" x2="622" y2="480" stroke="#111" stroke-width="1" marker-start="url(#da2)" marker-end="url(#da2)"/>
  <text x="590" y="560" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">⌀3.4（M3 中配过孔）</text>
  <text x="590" y="578" font-size="10" text-anchor="middle" fill="#666">穿 M3×16 不锈钢内六角螺栓</text>
  <text x="590" y="592" font-size="10" text-anchor="middle" fill="#666">拧入 P03 钢配重盘 M3 螺纹</text>

  <!-- ============================ 技术要求 + 标题块 ============================ -->
  <rect x="710" y="100" width="350" height="290" fill="#fff" stroke="#666" stroke-width="1.2" rx="3"/>
  <rect x="710" y="100" width="350" height="26" fill="#dfe5ea" stroke="#666" stroke-width="1.2"/>
  <text x="724" y="119" font-size="14" font-weight="bold" fill="#111">技术要求  Technical Requirements</text>

  <text x="724" y="148" font-size="12" font-weight="bold" fill="#222">① 材料</text>
  <text x="740" y="166" font-size="11" fill="#333">6061-T6 铝合金板，t=4 mm</text>
  <text x="740" y="180" font-size="11" fill="#333">与 P01 同批料更好（重量一致）</text>

  <text x="724" y="204" font-size="12" font-weight="bold" fill="#222">② 加工方式</text>
  <text x="740" y="222" font-size="11" fill="#333">激光切割（首选）</text>

  <text x="724" y="246" font-size="12" font-weight="bold" fill="#222">③ 表面处理</text>
  <text x="740" y="264" font-size="11" fill="#333">两面 240# 砂纸打磨（哑光）</text>
  <text x="740" y="278" font-size="11" fill="#333">棱倒角 C0.5×45°，孔口去毛刺</text>

  <text x="724" y="302" font-size="12" font-weight="bold" fill="#222">④ 公差</text>
  <text x="740" y="320" font-size="11" fill="#333">未标注：GB/T 1804-m 中等级</text>
  <text x="740" y="334" font-size="11" fill="#333">A-B 孔心距 ±0.1（直接影响 L₂）</text>
  <text x="740" y="348" font-size="11" fill="#333">孔径 ⌀5 H7（+0.012/0）</text>

  <text x="724" y="372" font-size="11" fill="#666" font-style="italic">两摆臂建议同时下料、同板加工，</text>
  <text x="724" y="386" font-size="11" fill="#666" font-style="italic">便于一致性控制。</text>

  <rect x="710" y="410" width="350" height="210" fill="#fafafa" stroke="#222" stroke-width="1.4"/>
  <line x1="710" y1="440" x2="1060" y2="440" stroke="#222" stroke-width="1"/>
  <line x1="710" y1="475" x2="1060" y2="475" stroke="#222" stroke-width="0.8"/>
  <line x1="710" y1="510" x2="1060" y2="510" stroke="#222" stroke-width="0.8"/>
  <line x1="710" y1="545" x2="1060" y2="545" stroke="#222" stroke-width="0.8"/>
  <line x1="710" y1="580" x2="1060" y2="580" stroke="#222" stroke-width="0.8"/>
  <line x1="850" y1="440" x2="850" y2="620" stroke="#222" stroke-width="0.8"/>

  <text x="724" y="432" font-size="13" font-weight="bold" fill="#111">标题块  Title Block</text>

  <text x="724" y="462" font-size="11" fill="#666">零件号</text>
  <text x="860" y="462" font-size="12" font-weight="bold" fill="#111">P02</text>
  <text x="724" y="497" font-size="11" fill="#666">名称</text>
  <text x="860" y="497" font-size="12" font-weight="bold" fill="#111">摆臂 2</text>
  <text x="724" y="532" font-size="11" fill="#666">数量</text>
  <text x="860" y="532" font-size="12" font-weight="bold" fill="#111">1</text>
  <text x="724" y="567" font-size="11" fill="#666">材料</text>
  <text x="860" y="567" font-size="12" fill="#111">6061-T6 / t=4</text>
  <text x="724" y="602" font-size="11" fill="#666">DXF 文件</text>
  <text x="860" y="602" font-size="11" fill="#111">parts/dxf/P02_arm_2.dxf</text>

  <rect x="40" y="650" width="1020" height="80" fill="#fff8e6" stroke="#d9a441" stroke-width="1.2" rx="4"/>
  <text x="55" y="671" font-size="12" font-weight="bold" fill="#7a5b15">⚠️ 给加工厂的备注</text>
  <text x="55" y="690" font-size="11" fill="#5a4216">· A-B 孔心距 200±0.1 是物理摆长 L₂，必须钻模一次装夹加工</text>
  <text x="55" y="706" font-size="11" fill="#5a4216">· B 孔 ⌀3.4 不要做 M3 螺纹（螺纹在 P03 钢盘上），这里是 ISO 中配过孔（slip-fit）</text>
  <text x="55" y="722" font-size="11" fill="#5a4216">· P01 与 P02 摆臂建议同板下料（同一块 6061 铝板），保证密度一致性</text>
</svg>
