<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" font-family="'Helvetica Neue', 'Songti SC', sans-serif">
  <!--
    ChaoticNet 双摆装置 零件图 P01 - 摆臂 1
    比例：2 px = 1 mm（front view）;  side view 与 hole detail 单独放大
    单位：mm  |  GB/T 1804-m 一般公差
  -->

  <defs>
    <marker id="da" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#111"/>
    </marker>
  </defs>

  <!-- ============================ 主图框 ============================ -->
  <rect x="20" y="20" width="1060" height="720" fill="none" stroke="#222" stroke-width="1.6"/>
  <rect x="20" y="20" width="1060" height="40" fill="#f0f0f0" stroke="#222" stroke-width="1.6"/>
  <text x="40" y="48" font-size="20" font-weight="bold" fill="#111">P01 · 摆臂 1（Pendulum Arm #1）</text>
  <text x="900" y="44" font-size="11" text-anchor="end" fill="#444">单位 mm · 比例 1:1 · GB/T 1804-m</text>
  <text x="900" y="56" font-size="11" text-anchor="end" fill="#444">ChaoticNet / 双摆混沌项目</text>

  <!-- ============================ 前视图标题 ============================ -->
  <text x="365" y="100" font-size="14" font-weight="bold" fill="#111">前视图  Front View（2:1 显示）</text>
  <line x1="40" y1="108" x2="700" y2="108" stroke="#999" stroke-width="0.6"/>

  <!-- ============================ 前视图：摆臂 1 轮廓（圆角矩形） ============================
    实际尺寸：275 mm 长 × 25 mm 宽 × 4 mm 厚（v2: 2→4mm，匹配 MR105ZZ 4mm 轴承宽）
    显示比例 2 px = 1 mm → 550 px × 50 px
    位置：x 75 → 625（左端→右端）, y 195 → 245
    两端圆弧半径 = 12.5 mm = 25 px
  -->
  <path d="M 100,195 L 600,195 A 25 25 0 0 1 600,245 L 100,245 A 25 25 0 0 1 100,195 Z"
        fill="#e8eaec" stroke="#111" stroke-width="2"/>

  <!-- 中心轴线 -->
  <line x1="70" y1="220" x2="630" y2="220" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="10,3,2,3"/>
  <text x="62" y="223" font-size="10" fill="#c0392b" text-anchor="end">⊕</text>
  <text x="638" y="223" font-size="10" fill="#c0392b">⊕</text>

  <!-- 孔 A（上端，配主轴承 MR105ZZ 外圈 ⌀10） -->
  <circle cx="125" cy="220" r="10" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="125" cy="220" r="2" fill="#111"/>
  <line x1="125" y1="200" x2="125" y2="240" stroke="#c0392b" stroke-width="0.6" stroke-dasharray="3,2"/>
  <line x1="105" y1="220" x2="145" y2="220" stroke="#c0392b" stroke-width="0.6" stroke-dasharray="3,2"/>
  <text x="120" y="187" font-size="13" font-weight="bold" fill="#c0392b">A</text>

  <!-- 孔 B（下端，配关节轴承 MR105ZZ 外圈 ⌀10） -->
  <circle cx="575" cy="220" r="10" fill="#fff" stroke="#111" stroke-width="1.8"/>
  <circle cx="575" cy="220" r="2" fill="#111"/>
  <line x1="575" y1="200" x2="575" y2="240" stroke="#c0392b" stroke-width="0.6" stroke-dasharray="3,2"/>
  <line x1="555" y1="220" x2="595" y2="220" stroke="#c0392b" stroke-width="0.6" stroke-dasharray="3,2"/>
  <text x="569" y="187" font-size="13" font-weight="bold" fill="#c0392b">B</text>

  <!-- ============================ 尺寸标注 ============================ -->
  <!-- 总长 275 mm -->
  <line x1="100" y1="295" x2="625" y2="295" stroke="#111" stroke-width="1" marker-start="url(#da)" marker-end="url(#da)"/>
  <line x1="100" y1="245" x2="100" y2="305" stroke="#111" stroke-width="0.6"/>
  <line x1="625" y1="245" x2="625" y2="305" stroke="#111" stroke-width="0.6"/>
  <text x="362" y="290" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">275 ±0.2</text>

  <!-- 总宽 25 mm -->
  <line x1="60" y1="195" x2="60" y2="245" stroke="#111" stroke-width="1" marker-start="url(#da)" marker-end="url(#da)"/>
  <line x1="50" y1="195" x2="100" y2="195" stroke="#111" stroke-width="0.6"/>
  <line x1="50" y1="245" x2="100" y2="245" stroke="#111" stroke-width="0.6"/>
  <text x="50" y="225" font-size="13" font-weight="bold" text-anchor="end" fill="#111">25 ±0.1</text>

  <!-- 孔 A 到左端：12.5 mm -->
  <line x1="100" y1="165" x2="125" y2="165" stroke="#111" stroke-width="1" marker-start="url(#da)" marker-end="url(#da)"/>
  <line x1="100" y1="160" x2="100" y2="195" stroke="#111" stroke-width="0.6"/>
  <line x1="125" y1="160" x2="125" y2="200" stroke="#111" stroke-width="0.6"/>
  <text x="113" y="156" font-size="11" text-anchor="middle" fill="#111">12.5</text>

  <!-- 孔 B 到右端：12.5 mm -->
  <line x1="575" y1="165" x2="625" y2="165" stroke="#111" stroke-width="1" marker-start="url(#da)" marker-end="url(#da)"/>
  <line x1="625" y1="160" x2="625" y2="195" stroke="#111" stroke-width="0.6"/>
  <line x1="575" y1="160" x2="575" y2="200" stroke="#111" stroke-width="0.6"/>
  <text x="600" y="156" font-size="11" text-anchor="middle" fill="#111">12.5</text>

  <!-- 孔心距 A-B：250 mm（关键尺寸） -->
  <line x1="125" y1="135" x2="575" y2="135" stroke="#c0392b" stroke-width="1.4" marker-start="url(#da)" marker-end="url(#da)"/>
  <line x1="125" y1="135" x2="125" y2="160" stroke="#c0392b" stroke-width="0.6"/>
  <line x1="575" y1="135" x2="575" y2="160" stroke="#c0392b" stroke-width="0.6"/>
  <text x="350" y="128" font-size="16" font-weight="bold" text-anchor="middle" fill="#c0392b">250 ±0.1</text>
  <text x="350" y="148" font-size="10" font-style="italic" text-anchor="middle" fill="#c0392b">= L₁ 物理摆长（关键尺寸）</text>

  <!-- 圆角 R12.5 -->
  <text x="115" y="270" font-size="11" fill="#111">R12.5</text>
  <line x1="116" y1="263" x2="100" y2="245" stroke="#111" stroke-width="0.6"/>

  <!-- ============================ 侧视图（左下，放大 5:1 看厚度） ============================ -->
  <text x="100" y="380" font-size="14" font-weight="bold" fill="#111">侧视图  Side View（5:1 放大）</text>
  <line x1="40" y1="388" x2="450" y2="388" stroke="#999" stroke-width="0.6"/>

  <!-- 侧视：摆臂厚度 4mm × 25mm 宽 → 显示 20 px × 125 px -->
  <rect x="100" y="430" width="20" height="125" fill="#e8eaec" stroke="#111" stroke-width="1.8"/>

  <!-- 厚度尺寸 -->
  <line x1="100" y1="580" x2="120" y2="580" stroke="#111" stroke-width="1" marker-start="url(#da)" marker-end="url(#da)"/>
  <line x1="100" y1="555" x2="100" y2="585" stroke="#111" stroke-width="0.6"/>
  <line x1="120" y1="555" x2="120" y2="585" stroke="#111" stroke-width="0.6"/>
  <text x="110" y="600" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">4 ±0.05</text>
  <text x="110" y="615" font-size="10" text-anchor="middle" fill="#666">（厚度）</text>

  <!-- 宽度参考 -->
  <line x1="140" y1="430" x2="140" y2="555" stroke="#111" stroke-width="1" marker-start="url(#da)" marker-end="url(#da)"/>
  <line x1="120" y1="430" x2="145" y2="430" stroke="#111" stroke-width="0.6"/>
  <line x1="120" y1="555" x2="145" y2="555" stroke="#111" stroke-width="0.6"/>
  <text x="165" y="495" font-size="12" fill="#111">25</text>

  <!-- 棱倒角说明 -->
  <line x1="100" y1="430" x2="80" y2="420" stroke="#111" stroke-width="0.6"/>
  <text x="60" y="416" font-size="10" fill="#111">C0.5×45°</text>

  <!-- ============================ 孔位详图（左下右侧，放大 8:1） ============================ -->
  <text x="290" y="380" font-size="14" font-weight="bold" fill="#111">孔位详图  Hole Detail（8:1，A、B 通用）</text>

  <!-- 8:1 放大：5mm 孔 → 40 px 直径 -->
  <circle cx="380" cy="490" r="40" fill="#fff" stroke="#111" stroke-width="2.2"/>
  <circle cx="380" cy="490" r="3" fill="#111"/>
  <!-- 十字中心线 -->
  <line x1="320" y1="490" x2="440" y2="490" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="8,3,2,3"/>
  <line x1="380" y1="430" x2="380" y2="550" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="8,3,2,3"/>

  <!-- 孔径标注：⌀10 H7（轴承外圈过盈配合） -->
  <line x1="340" y1="490" x2="420" y2="490" stroke="#111" stroke-width="1" marker-start="url(#da)" marker-end="url(#da)"/>
  <text x="380" y="570" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">⌀10 H7（+0.015 / 0）</text>
  <text x="380" y="588" font-size="11" text-anchor="middle" fill="#666">配 MR105ZZ 轴承外圈，孔壁涂 Loctite 638</text>
  <text x="380" y="603" font-size="11" text-anchor="middle" fill="#666">轴承胶固持（H7 + 胶 ≈ 工业 K7 装配）</text>
  <text x="380" y="618" font-size="11" text-anchor="middle" fill="#666">通孔，两端 C0.5 倒角去毛刺</text>

  <!-- ============================ 右侧标题块 + 技术要求 ============================ -->
  <!-- 技术要求 -->
  <rect x="710" y="100" width="350" height="290" fill="#fff" stroke="#666" stroke-width="1.2" rx="3"/>
  <rect x="710" y="100" width="350" height="26" fill="#dfe5ea" stroke="#666" stroke-width="1.2"/>
  <text x="724" y="119" font-size="14" font-weight="bold" fill="#111">技术要求  Technical Requirements</text>

  <text x="724" y="148" font-size="12" font-weight="bold" fill="#222">① 材料</text>
  <text x="740" y="166" font-size="11" fill="#333">6061-T6 铝合金板，厚度 4 mm</text>
  <text x="740" y="180" font-size="11" fill="#333">（4mm 完整覆盖 MR105ZZ 轴承宽 4mm）</text>

  <text x="724" y="204" font-size="12" font-weight="bold" fill="#222">② 加工方式</text>
  <text x="740" y="222" font-size="11" fill="#333">激光切割（首选）或水刀切割</text>
  <text x="740" y="236" font-size="11" fill="#333">CNC 铣亦可（精度更高但贵）</text>

  <text x="724" y="260" font-size="12" font-weight="bold" fill="#222">③ 表面处理</text>
  <text x="740" y="278" font-size="11" fill="#333">两面 240# 砂纸打磨（哑光）</text>
  <text x="740" y="292" font-size="11" fill="#333">所有棱倒角 C0.5×45°</text>
  <text x="740" y="306" font-size="11" fill="#333">孔口两侧去毛刺（不可有飞边）</text>

  <text x="724" y="330" font-size="12" font-weight="bold" fill="#222">④ 公差</text>
  <text x="740" y="348" font-size="11" fill="#333">未标注：GB/T 1804-m 中等级</text>
  <text x="740" y="362" font-size="11" fill="#333">关键孔位（A-B 孔心距）必须 ±0.1</text>
  <text x="740" y="376" font-size="11" fill="#333">直接影响 L₁ 物理参数</text>

  <!-- 标题块 -->
  <rect x="710" y="410" width="350" height="210" fill="#fafafa" stroke="#222" stroke-width="1.4"/>
  <line x1="710" y1="440" x2="1060" y2="440" stroke="#222" stroke-width="1"/>
  <line x1="710" y1="475" x2="1060" y2="475" stroke="#222" stroke-width="0.8"/>
  <line x1="710" y1="510" x2="1060" y2="510" stroke="#222" stroke-width="0.8"/>
  <line x1="710" y1="545" x2="1060" y2="545" stroke="#222" stroke-width="0.8"/>
  <line x1="710" y1="580" x2="1060" y2="580" stroke="#222" stroke-width="0.8"/>
  <line x1="850" y1="440" x2="850" y2="620" stroke="#222" stroke-width="0.8"/>

  <text x="724" y="432" font-size="13" font-weight="bold" fill="#111">标题块  Title Block</text>

  <text x="724" y="462" font-size="11" fill="#666">零件号</text>
  <text x="860" y="462" font-size="12" font-weight="bold" fill="#111">P01</text>
  <text x="724" y="497" font-size="11" fill="#666">名称</text>
  <text x="860" y="497" font-size="12" font-weight="bold" fill="#111">摆臂 1</text>
  <text x="724" y="532" font-size="11" fill="#666">数量</text>
  <text x="860" y="532" font-size="12" font-weight="bold" fill="#111">1</text>
  <text x="724" y="567" font-size="11" fill="#666">材料</text>
  <text x="860" y="567" font-size="12" fill="#111">6061-T6 / t=4</text>
  <text x="724" y="602" font-size="11" fill="#666">DXF 文件</text>
  <text x="860" y="602" font-size="11" fill="#111">parts/dxf/P01_arm_1.dxf</text>

  <!-- ============================ 底部注解 ============================ -->
  <rect x="40" y="650" width="1020" height="80" fill="#fff8e6" stroke="#d9a441" stroke-width="1.2" rx="4"/>
  <text x="55" y="671" font-size="12" font-weight="bold" fill="#7a5b15">⚠️ 给加工厂的备注</text>
  <text x="55" y="690" font-size="11" fill="#5a4216">· A-B 孔心距 250±0.1 是物理摆长 L₁，直接影响实验数据，请用钻模或一次装夹钻两孔，不要分两次定位</text>
  <text x="55" y="706" font-size="11" fill="#5a4216">· ⌀10 H7 孔配 MR105ZZ 轴承外圈（10×5×4）：装配前孔内涂 Loctite 638 一周圈，压入轴承端面与摆臂齐平，固化 24h 后旋转</text>
  <text x="55" y="722" font-size="11" fill="#5a4216">· 板厚 4mm 与 MR105ZZ 轴承等宽，轴承齐平嵌入；孔单边距 7.5mm 低载荷可接受</text>
</svg>
