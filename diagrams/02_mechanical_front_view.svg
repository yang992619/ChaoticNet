<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="'Helvetica Neue', 'Songti SC', sans-serif">
  <!--
    双摆装置机械装配图（正视图）
    比例：1 mm = 0.8 px（图上 400 px = 500 mm）
    用于论文第 3 章 实验装置与数据采集
    单位：mm
  -->

  <defs>
    <!-- 尺寸线箭头 -->
    <marker id="dimArrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#222"/>
    </marker>
    <!-- 装配图填充：2020 铝型材横截面图案 -->
    <pattern id="alupat" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect width="6" height="6" fill="#cfd6dc"/>
      <path d="M 0 6 L 6 0" stroke="#9aa5af" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- 标题块 -->
  <text x="450" y="32" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">双摆实验装置 — 机械装配正视图</text>
  <text x="450" y="55" font-size="13" text-anchor="middle" fill="#666">Double Pendulum Mechanical Assembly · Front View · 单位 mm · 比例 1:1.25</text>

  <!-- ============================ 黑色对比背板（衬托视觉追踪） ============================ -->
  <rect x="240" y="100" width="320" height="440" fill="#1c1c1c" stroke="#000" stroke-width="0.6"/>
  <text x="248" y="115" font-size="10" fill="#aaa">哑光黑亚克力背板 3mm</text>

  <!-- ============================ 2020 铝型材主框架 ============================ -->
  <!-- 左立柱（外缘 x=200..220，高 60..540 → 实际 600mm） -->
  <rect x="200" y="60" width="20" height="500" fill="url(#alupat)" stroke="#333" stroke-width="1.2"/>
  <!-- 右立柱 -->
  <rect x="580" y="60" width="20" height="500" fill="url(#alupat)" stroke="#333" stroke-width="1.2"/>
  <!-- 上横梁 -->
  <rect x="200" y="60" width="400" height="20" fill="url(#alupat)" stroke="#333" stroke-width="1.2"/>
  <!-- 下横梁（底座） -->
  <rect x="200" y="540" width="400" height="20" fill="url(#alupat)" stroke="#333" stroke-width="1.2"/>

  <!-- 角连接件（4 处）：黑色方块 -->
  <rect x="195" y="55" width="30" height="30" fill="#222" opacity="0.85"/>
  <rect x="575" y="55" width="30" height="30" fill="#222" opacity="0.85"/>
  <rect x="195" y="535" width="30" height="30" fill="#222" opacity="0.85"/>
  <rect x="575" y="535" width="30" height="30" fill="#222" opacity="0.85"/>

  <!-- 底座支撑脚（2 个） -->
  <rect x="240" y="560" width="60" height="20" fill="#444"/>
  <rect x="500" y="560" width="60" height="20" fill="#444"/>

  <!-- ============================ 枢轴（上横梁中心）+ 主轴承 MR105ZZ ============================ -->
  <!-- 主轴承外圈（10mm，画 16 px 直径） -->
  <circle cx="400" cy="90" r="9" fill="#fff" stroke="#222" stroke-width="2"/>
  <circle cx="400" cy="90" r="4" fill="#222"/>
  <text x="416" y="86" font-size="10" fill="#222">MR105ZZ</text>
  <text x="416" y="98" font-size="9" fill="#666">10×5×4 双侧防尘</text>

  <!-- ============================ 摆臂 1（L1=250mm, 25×4mm 铝板，v2） ============================ -->
  <!-- 屏幕坐标：枢轴 (400,90)，垂直向下 200 px = 250 mm
       摆臂宽度 25mm = 20 px → x: 390..410 -->
  <rect x="390" y="90" width="20" height="200" fill="#e3e6e8" stroke="#222" stroke-width="1.5"/>
  <!-- 摆臂 1 中央长条减重孔（视觉上区分） -->
  <rect x="395" y="120" width="10" height="140" fill="none" stroke="#999" stroke-width="0.6" stroke-dasharray="3,2" rx="3"/>

  <!-- ============================ 摆臂 1 下端关节轴承（MR105ZZ #2） ============================ -->
  <circle cx="400" cy="290" r="9" fill="#fff" stroke="#222" stroke-width="2"/>
  <circle cx="400" cy="290" r="4" fill="#222"/>

  <!-- ============================ 摆臂 2（L2=200mm, 25×4mm 铝板，配重端，v2） ============================ -->
  <rect x="390" y="290" width="20" height="160" fill="#e3e6e8" stroke="#222" stroke-width="1.5"/>
  <!-- 摆 2 末端配重盘（v2.1: 45# 钢，⌀30×12mm，≈66g） -->
  <circle cx="400" cy="465" r="15" fill="#9aa0a6" stroke="#4a4f54" stroke-width="1.5"/>
  <text x="420" y="468" font-size="10" fill="#222">45# 钢配重盘 ⌀30, ≈66g</text>

  <!-- ============================ 视觉追踪荧光标记点（3 处） ============================ -->
  <!-- 标记 P0：枢轴位置（参考点） -->
  <circle cx="400" cy="90" r="3" fill="#ff3b3b" stroke="#fff" stroke-width="0.8"/>
  <text x="370" y="78" font-size="11" font-weight="bold" fill="#ff3b3b">P₀</text>
  <!-- 标记 P1：摆臂 1 末端（θ1 追踪点） -->
  <circle cx="400" cy="290" r="3" fill="#ff3b3b" stroke="#fff" stroke-width="0.8"/>
  <text x="416" y="276" font-size="11" font-weight="bold" fill="#ff3b3b">P₁</text>
  <!-- 标记 P2：摆臂 2 末端（θ2 追踪点） -->
  <circle cx="400" cy="465" r="3" fill="#ff3b3b" stroke="#fff" stroke-width="0.8"/>
  <text x="420" y="455" font-size="11" font-weight="bold" fill="#ff3b3b">P₂</text>

  <!-- ============================ 量角器刻度盘（仅作粗目视参考，不用于定初值） ============================ -->
  <!-- 半圆刻度盘，半径 40，以枢轴为中心 -->
  <path d="M 360 90 A 40 40 0 0 1 440 90" fill="none" stroke="#3498db" stroke-width="1.2" stroke-dasharray="2,2"/>
  <text x="346" y="135" font-size="9" fill="#3498db">量角器（粗参考）</text>

  <!-- ============================ 尺寸标注（左侧） ============================ -->
  <!-- 总高 600 mm -->
  <line x1="150" y1="60" x2="150" y2="560" stroke="#222" stroke-width="1"/>
  <line x1="150" y1="60" x2="160" y2="60" stroke="#222" stroke-width="1"/>
  <line x1="150" y1="560" x2="160" y2="560" stroke="#222" stroke-width="1"/>
  <line x1="150" y1="80" x2="150" y2="540" stroke="#222" stroke-width="1" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <text x="125" y="315" font-size="14" font-weight="bold" fill="#222" transform="rotate(-90, 125, 315)">600</text>

  <!-- L1 = 250 mm（摆 1 长度） -->
  <line x1="500" y1="90" x2="490" y2="90" stroke="#c0392b" stroke-width="1"/>
  <line x1="500" y1="290" x2="490" y2="290" stroke="#c0392b" stroke-width="1"/>
  <line x1="500" y1="105" x2="500" y2="275" stroke="#c0392b" stroke-width="1.2" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <text x="510" y="195" font-size="14" font-weight="bold" fill="#c0392b">L₁ = 250</text>

  <!-- L2 = 200 mm（摆 2 长度） -->
  <line x1="500" y1="290" x2="490" y2="290" stroke="#c0392b" stroke-width="1"/>
  <line x1="500" y1="465" x2="490" y2="465" stroke="#c0392b" stroke-width="1"/>
  <line x1="500" y1="305" x2="500" y2="450" stroke="#c0392b" stroke-width="1.2" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <text x="510" y="385" font-size="14" font-weight="bold" fill="#c0392b">L₂ = 200</text>

  <!-- 总宽 500 mm -->
  <line x1="200" y1="600" x2="600" y2="600" stroke="#222" stroke-width="1.2" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <line x1="200" y1="595" x2="200" y2="605" stroke="#222" stroke-width="1"/>
  <line x1="600" y1="595" x2="600" y2="605" stroke="#222" stroke-width="1"/>
  <text x="395" y="619" font-size="14" font-weight="bold" fill="#222">500</text>

  <!-- 摆臂宽度 25 mm（局部放大示意） -->
  <line x1="390" y1="170" x2="390" y2="155" stroke="#666" stroke-width="0.8"/>
  <line x1="410" y1="170" x2="410" y2="155" stroke="#666" stroke-width="0.8"/>
  <line x1="385" y1="160" x2="415" y2="160" stroke="#666" stroke-width="1" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <text x="420" y="164" font-size="11" fill="#666">25</text>

  <!-- ============================ 材料/规格清单（右侧） ============================ -->
  <rect x="650" y="80" width="230" height="320" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="6"/>
  <text x="660" y="103" font-size="14" font-weight="bold" fill="#222">材料与规格清单</text>
  <line x1="660" y1="110" x2="870" y2="110" stroke="#999" stroke-width="0.6"/>

  <text x="660" y="130" font-size="11" font-weight="bold" fill="#333">① 主框架</text>
  <text x="668" y="148" font-size="10" fill="#444">2020 工业铝型材 × 4 段</text>
  <text x="668" y="162" font-size="10" fill="#444">立柱 600mm × 2 / 横梁 500mm × 2</text>
  <text x="668" y="176" font-size="10" fill="#444">配 4 个 L 形角件</text>

  <text x="660" y="198" font-size="11" font-weight="bold" fill="#333">② 摆臂</text>
  <text x="668" y="216" font-size="10" fill="#444">6061-T6 铝板 4mm 厚（v2）</text>
  <text x="668" y="230" font-size="10" fill="#444">摆 1: 25×250 mm（含轴孔）</text>
  <text x="668" y="244" font-size="10" fill="#444">摆 2: 25×200 mm（含轴孔+配重孔）</text>

  <text x="660" y="266" font-size="11" font-weight="bold" fill="#333">③ 轴承</text>
  <text x="668" y="284" font-size="10" fill="#444">MR105ZZ × 2（10×5×4 mm，双侧防尘）</text>
  <text x="668" y="298" font-size="10" fill="#444">钟表润滑油 1 滴/轴，目标衰减 τ ≥ 30 s（实测待补）</text>

  <text x="660" y="320" font-size="11" font-weight="bold" fill="#333">④ 配重</text>
  <text x="668" y="338" font-size="10" fill="#444">45# 钢盘 ⌀30 × 厚 12 mm，≈66 g</text>
  <text x="668" y="352" font-size="10" fill="#444">M3 螺栓固定于摆 2 末端</text>

  <text x="660" y="374" font-size="11" font-weight="bold" fill="#333">⑤ 视觉标记 P₀/P₁/P₂</text>
  <text x="668" y="392" font-size="10" fill="#444">3M 反光荧光红圆点 ⌀5 mm</text>

  <!-- ============================ 视觉追踪说明（右下） ============================ -->
  <rect x="650" y="410" width="230" height="130" fill="#fff8e6" stroke="#d9a441" stroke-width="1.2" rx="6"/>
  <text x="660" y="430" font-size="13" font-weight="bold" fill="#9a6b1f">视觉追踪要点</text>
  <text x="660" y="450" font-size="10" fill="#5a4216">· 哑光黑背板与红色荧光点</text>
  <text x="672" y="464" font-size="10" fill="#5a4216">  形成强反差 → 阈值分割可靠</text>
  <text x="660" y="482" font-size="10" fill="#5a4216">· 摆动平面严格平行于背板</text>
  <text x="672" y="496" font-size="10" fill="#5a4216">  （二维近似，附录 F 验证）</text>
  <text x="660" y="514" font-size="10" fill="#5a4216">· P₀ 作为坐标原点，每帧</text>
  <text x="672" y="528" font-size="10" fill="#5a4216">  自校准抑制相机轻微抖动</text>

  <!-- ============================ 释放装置说明（左下角） ============================ -->
  <rect x="40" y="610" width="380" height="90" fill="#eef6f0" stroke="#5fa572" stroke-width="1.2" rx="6"/>
  <text x="50" y="630" font-size="13" font-weight="bold" fill="#2a6a3b">初值设定（手动释放）</text>
  <text x="50" y="650" font-size="10" fill="#1f4e2a">手动将摆抬至目标角后干净放手（原电磁吸盘吸力不足已弃用）</text>
  <text x="50" y="666" font-size="10" fill="#1f4e2a">初始状态 (θ₁,θ₂,ω₁,ω₂) 由释放后视频引入窗反演得到</text>
  <text x="50" y="682" font-size="10" fill="#1f4e2a">±0.5° 为视觉反演的初值状态估计不确定度（σθ≈0.45°）</text>

  <!-- 比例说明 -->
  <text x="440" y="710" font-size="11" text-anchor="middle" fill="#666">所有尺寸单位为毫米（mm），未标注公差按 ±0.5 mm 控制</text>

</svg>
